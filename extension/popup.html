<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Dogfoods the palette: popup.js stamps --omarchy-* onto <html>. */
  body {
    width: 280px; margin: 0; font: 13px system-ui, sans-serif;
    background: var(--omarchy-background, #1e1e2e);
    color: var(--omarchy-foreground, #cdd6f4);
  }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px }
  header img { width: 20px; height: 20px }
  header h1 { font-size: 14px; margin: 0; flex: 1 }
  #mode { font-size: 11px; opacity: .6 }
  section { padding: 10px 14px }
  .muted { opacity: .6; font-size: 12px }

  /* The primary control: one big target, sitting directly above the hostname
     it applies to, so the scope of the click reads off the layout. */
  .power {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 6px 14px 14px;
    border-bottom: 1px solid color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 15%, transparent);
  }
  #power {
    flex: none; width: 64px; height: 64px; padding: 0;
    display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    border: 2px solid color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 22%, transparent);
    background: transparent;
    color: color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 45%, transparent);
    transition: color .12s, background .12s, border-color .12s, transform .08s;
  }
  #power svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round }
  #power[aria-pressed="true"] {
    border-color: var(--omarchy-accent, #61afef);
    color: var(--omarchy-accent, #61afef);
    background: color-mix(in srgb, var(--omarchy-accent, #61afef) 16%, transparent);
  }
  /* Off and "nothing claims this URL" are one look on purpose: neither puts
     anything on the page, and the icon alone can't say which. The whole block
     dims rather than the button alone. */
  #power[aria-pressed="false"] ~ #site,
  #power[aria-pressed="false"] ~ #sheet { opacity: .45 }
  #power:hover:not(:disabled) { background: color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 12%, transparent) }
  #power[aria-pressed="true"]:hover:not(:disabled) { background: color-mix(in srgb, var(--omarchy-accent, #61afef) 26%, transparent) }
  #power:active:not(:disabled) { transform: scale(.94) }
  #power:focus-visible { outline: 2px solid var(--omarchy-accent, #61afef); outline-offset: 3px }
  #site { font-size: 12px; font-weight: 600; word-break: break-all; text-align: center; margin: 2px 0 0 }
  #sheet { font-size: 11px; opacity: .6 }

  .actions { display: flex; gap: 6px }
  button {
    flex: 1; padding: 6px 0; font: 12px system-ui; cursor: pointer; border-radius: 5px;
    border: 1px solid color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 25%, transparent);
    background: color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 8%, transparent);
    color: var(--omarchy-foreground, #cdd6f4);
  }
  button:disabled { opacity: .4; cursor: default }
  #generate { background: var(--omarchy-accent, #61afef); color: var(--omarchy-background, #1e1e2e); border-color: transparent }
  #gen-status { font-size: 11px; margin-top: 8px; min-height: 14px }
  #gen-status.error { color: var(--omarchy-red, #f66) }
  footer {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 8px 14px; font-size: 10px; opacity: .55;
    border-top: 1px solid color-mix(in srgb, var(--omarchy-foreground, #cdd6f4) 15%, transparent);
  }
  /* The footer is dim by design, so a dead host has to shout past that. */
  #host-status.down { color: var(--omarchy-red, #f66); opacity: 1 }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>Umber</h1>
    <span id="mode"></span>
  </header>
  <section class="power">
    <button id="power" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.5v8.5"/>
        <path d="M7.4 6.6a7.5 7.5 0 1 0 9.2 0"/>
      </svg>
    </button>
    <div id="site"></div>
    <div id="sheet"></div>
  </section>
  <section>
    <div class="actions">
      <button id="pick">Pick element…</button>
      <button id="generate">Theme with agent</button>
    </div>
    <div id="gen-status"></div>
  </section>
  <footer>
    <span id="host-status">host: …</span>
    <span>~/.config/umber/sites/</span>
  </footer>
  <script src="match.js"></script>
  <script src="popup.js"></script>
</body>
</html>
